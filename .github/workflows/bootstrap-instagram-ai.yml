name: Bootstrap Instagram AI app

on:
  push:
    branches:
      - agent/instagram-ai-weekly-app
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-instagram-ai-app
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/instagram-ai-weekly-app
          fetch-depth: 0

      - name: Expand application payload
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .bootstrap ]; then
            echo "Bootstrap payload already consumed."
            exit 0
          fi

          cat .bootstrap/part-* > /tmp/ia-weekly.tar.gz.b64
          base64 --decode /tmp/ia-weekly.tar.gz.b64 > /tmp/ia-weekly.tar.gz
          tar -xzf /tmp/ia-weekly.tar.gz
          rm -rf .bootstrap

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Instagram AI weekly app [bootstrap-complete]"
          git push origin HEAD:agent/instagram-ai-weekly-app
