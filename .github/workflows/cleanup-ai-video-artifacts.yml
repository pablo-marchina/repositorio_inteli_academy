name: Cleanup AI video build artifacts

on:
  push:
    branches: ["feature/ai-video-timeline-davinci"]
    paths: [".github/workflows/cleanup-ai-video-artifacts.yml"]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/ai-video-timeline-davinci
          fetch-depth: 0
      - name: Remove generated files
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- next-env.d.ts tsconfig.json
          rm -f package-lock.json tsconfig.tsbuildinfo
          rm -f .github/workflows/cleanup-ai-video-artifacts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove generated build artifacts"
          git push origin HEAD:feature/ai-video-timeline-davinci
