name: Bump Reel editing plan to v3

on:
  push:
    branches: ["fix/reel-editing-v3-reanalysis"]
    paths: [".github/workflows/bump-reel-v3.yml"]

permissions:
  contents: write

jobs:
  update-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/reel-editing-v3-reanalysis
          fetch-depth: 0
      - name: Require v3 AI editing plans
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          changes = {
              'lib/studio-reel-analysis.ts': [
                  ('const SEMANTIC_ANALYSIS_VERSION = 2;', 'const SEMANTIC_ANALYSIS_VERSION = 3;'),
              ],
              'lib/studio.ts': [
                  ('const referenceIsCurrent = !plan.reference || (plan.reference.semanticVersion ?? 0) >= 2;', 'const referenceIsCurrent = !plan.reference || (plan.reference.semanticVersion ?? 0) >= 3;'),
                  ('return semanticVersion >= 2 && referenceIsCurrent && everyUsedShotWasAnalyzed ? plan : undefined;', 'return semanticVersion >= 3 && referenceIsCurrent && everyUsedShotWasAnalyzed ? plan : undefined;'),
              ],
              'app/api/studio/[projectId]/versions/[versionId]/render-reel/route.ts': [
                  ('(plan.analysisSummary?.semanticVersion ?? 0) < 2', '(plan.analysisSummary?.semanticVersion ?? 0) < 3'),
                  ('(plan.reference.semanticVersion ?? 0) < 2', '(plan.reference.semanticVersion ?? 0) < 3'),
              ],
          }
          for file, replacements in changes.items():
              path = Path(file)
              text = path.read_text()
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {file}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
          rm -f .github/workflows/bump-reel-v3.yml
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run check:generalization
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://example.com
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SECRET_KEY: test-secret-key
          APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          CRON_SECRET: test-cron-secret-with-at-least-24-characters
      - name: Commit validated v3 gate
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- next-env.d.ts tsconfig.json
          rm -f package-lock.json tsconfig.tsbuildinfo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Require v3 AI Reel editing plans"
          git push origin HEAD:fix/reel-editing-v3-reanalysis
