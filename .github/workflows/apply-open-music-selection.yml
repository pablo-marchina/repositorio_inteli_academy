  assetId: string;
  durationSeconds: number;
  bpm: number | null;
  beatSeconds: number[];
  analysisMode: "audio";
};''', '''export type MusicBeatAnalysis = {
  assetId?: string;
  durationSeconds: number;
  bpm: number | null;
  beatSeconds: number[];
  analysisMode: "audio" | "ai-estimated";
};

