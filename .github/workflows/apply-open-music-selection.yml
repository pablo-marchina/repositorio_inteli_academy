name: Apply open AI music selection

on:
  push:
    branches:
      - fix/ai-open-music-selection

permissions:
  contents: write

jobs:
  refactor-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/ai-open-music-selection
          fetch-depth: 0
      - name: Apply refactor
        run: python3 .github/open-music-patch.py
      - name: Clean refactor lint residues
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/studio-reel-analysis.ts')
          text = path.read_text()
          text, count = re.subn(r'\nconst musicSchema = z\.object\(\{.*?\n\}\);\n\nconst musicDirectionSchema', '\nconst musicDirectionSchema', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'expected to remove one unused musicSchema, removed {count}')
          path.write_text(text)

          path = Path('lib/studio.ts')
          text = path.read_text()
          text = text.replace('import { getDriveAsset, listDriveMedia } from "@/lib/google-drive";', 'import { getDriveAsset } from "@/lib/google-drive";', 1)
          text = text.replace('  let driveAssets = Array.isArray(project.drive_assets) ? (project.drive_assets as DriveAsset[]).filter((asset) => !asset.mimeType.startsWith("audio/")) : [];', '  const driveAssets = Array.isArray(project.drive_assets) ? (project.drive_assets as DriveAsset[]).filter((asset) => !asset.mimeType.startsWith("audio/")) : [];', 1)
          path.write_text(text)
          PY
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run check:generalization
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Let AI choose Reel music independently of Drive"
          git push origin HEAD:fix/ai-open-music-selection
