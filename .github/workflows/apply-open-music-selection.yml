name: Apply open AI music selection

on:
  push:
    branches:
      - fix/ai-open-music-selection

permissions:
  contents: write

jobs:
  refactor-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/ai-open-music-selection
          fetch-depth: 0
      - name: Apply refactor
        run: python3 .github/open-music-patch.py
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run check:generalization
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Let AI choose Reel music independently of Drive"
          git push origin HEAD:fix/ai-open-music-selection
