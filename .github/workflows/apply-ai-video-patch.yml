name: Apply AI video patch

on:
  push:
    branches: ["feature/ai-video-timeline-davinci"]
    paths: [".github/workflows/apply-ai-video-patch.yml"]

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/ai-video-timeline-davinci
          fetch-depth: 0
      - name: Recover and apply full AI video patch
        shell: bash
        run: |
          set -euo pipefail
          for part in 00 01 02; do
            git show "origin/feat/ai-video-editing-davinci:.github/ai-video-davinci.patch.gz.b64.${part}"
          done > /tmp/ai-video.patch.gz.b64
          base64 --decode /tmp/ai-video.patch.gz.b64 > /tmp/ai-video.patch.gz
          set +e
          gzip -dc /tmp/ai-video.patch.gz > /tmp/ai-video.patch 2>/tmp/gzip-error
          gzip_status=$?
          set -e
          if [ "$gzip_status" -ne 0 ]; then
            echo "Recovered gzip stream with non-fatal trailer/CRC error:"
            cat /tmp/gzip-error
          fi
          test -s /tmp/ai-video.patch
          for required in \
            'lib/studio-davinci-export.ts' \
            'lib/studio-reel-analysis.ts' \
            'lib/studio-reel-render.ts' \
            'lib/studio.ts' \
            'scripts/check-studio-generalization.mjs'; do
            grep -q "$required" /tmp/ai-video.patch || { echo "Recovered patch is missing $required"; exit 1; }
          done
          patch --dry-run -p1 --forward --batch < /tmp/ai-video.patch
          patch -p1 --forward --batch < /tmp/ai-video.patch
      - name: Apply backward-compatible timeline fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          analysis = Path('lib/studio-reel-analysis.ts')
          text = analysis.read_text()
          if 'function isReelReference(' not in text:
              marker = re.search(r'function isVisualAsset\(asset: DriveAsset\) \{.*?\n\}', text, re.S)
              if not marker:
                  raise SystemExit('Could not locate isVisualAsset helper')
              helper = '''\n\nfunction isReelReference(reference: InstagramReferencePost) {\n  return reference.mediaType === "VIDEO" || reference.mediaProductType === "REELS" || reference.mediaProductType === "REEL";\n}'''
              text = text[:marker.end()] + helper + text[marker.end():]
          text = re.sub(r'(\n\s*)transitionDurationSeconds:\s*number;', r'\1transitionDurationSeconds?: number;', text, count=1)
          analysis.write_text(text)

          artifact = Path('lib/studio-artifact.ts')
          artifact_text = artifact.read_text()
          artifact_text = artifact_text.replace('shot.transitionDurationSeconds * fps', '(shot.transitionDurationSeconds ?? 0) * fps')
          artifact.write_text(artifact_text)
          PY
          rm -rf .github/ai-video-patch
          rm -f .github/workflows/apply-ai-video-patch.yml
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run check:generalization
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://example.com
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SECRET_KEY: test-secret-key
          APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          CRON_SECRET: test-cron-secret-with-at-least-24-characters
      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes produced by patch"; exit 1; }
          git commit -m "Implement AI-directed video editing and DaVinci export"
          git push origin HEAD:feature/ai-video-timeline-davinci
